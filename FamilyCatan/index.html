<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Catan">
<meta name="theme-color" content="#0d3a23">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Family Catan</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap");
  :root {
    --felt1: #2e4a66;
    --felt2: #5b84a8;
    --panel: #faf6ec;
    --ink: #2b2b2b;
    --accent: #b03a2e;
    --gold: #d4a017;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.07), transparent 60%),
      radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.45), transparent 60%),
      linear-gradient(160deg, var(--felt2), var(--felt1));
    color: var(--ink);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    touch-action: manipulation;
  }
  h1, h2, .btn { font-family: "Baloo 2", -apple-system, 'Segoe UI', sans-serif; }
  #app { width: 100%; max-width: 1200px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #main { display: flex; gap: 10px; align-items: stretch; min-height: calc(100vh - 20px); min-height: calc(100dvh - 20px); }
  #boardWrap {
    flex: 1 1 auto; background: rgba(0,0,0,.25); border-radius: 16px; padding: 6px;
    display: flex; justify-content: center; align-items: center; min-width: 0;
    touch-action: none; cursor: grab;
    min-height: calc(100vh - 20px); min-height: calc(100dvh - 20px);
    box-shadow: inset 0 2px 12px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.12);
  }
  #board { width: 100%; height: 100%; max-height: none; touch-action: none; display: block; }
  #board .hex polygon { filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
  #panel {
    flex: 0 0 360px; background: linear-gradient(180deg, #fffdf6, var(--panel));
    border-radius: 16px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 20px); overflow-y: auto;
    box-shadow: 0 4px 14px rgba(0,0,0,.35); border: 1px solid #e8dcc0;
  }
  @media (max-width: 760px) and (orientation: portrait) {
    #main { flex-direction: column; min-height: 0; }
    #boardWrap { min-height: 0; }
    #panel { flex: none; max-height: none; }
    #board { height: auto; max-height: 52vh; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    #app { gap: 6px; padding: 6px; }
    #boardWrap { height: 94vh; }
    #board { width: 100%; height: 100%; max-height: none; }
    #panel { flex: 0 0 260px; max-height: 94vh; padding: 10px; gap: 8px; overflow-y: auto; }
    #tabBar { display: flex; gap: 6px; flex-shrink: 0; }
    .tabbtn {
      flex: 1; border: 2px solid #d8cba4; background: #efe8d2; border-radius: 10px;
      padding: 8px 4px; font-size: .85rem; font-weight: 700; cursor: pointer; color: var(--ink);
    }
    .tabbtn.active { background: linear-gradient(180deg,#ffffff,#f7f1de); border-color: var(--gold); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    .tabbtn.notify { animation: turnGlow 1.6s ease-in-out infinite; border-color: #d35450; }
    .tabpane { display: none; }
    .tabpane.active { display: flex; flex-direction: column; gap: 8px; }
    #zoomHint { display: none; }
    .btn { padding: 8px 10px; font-size: .88rem; }
  }
  .btn {
    border: none; border-radius: 12px; padding: 10px 14px; font-size: .95rem; font-weight: 700;
    cursor: pointer; color: var(--ink);
    background: linear-gradient(180deg, #ffffff, #efe8d2);
    border: 2px solid #d8cba4;
    box-shadow: 0 3px 0 #c9b98f, 0 4px 8px rgba(0,0,0,.15);
    transition: transform .06s ease, box-shadow .06s ease;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c9b98f; }
  .btn.primary { background: linear-gradient(180deg, #d35450, var(--accent)); border-color: #8e2f24; color: #fff; box-shadow: 0 3px 0 #7c271e, 0 4px 8px rgba(0,0,0,.25); text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .btn.primary:active { box-shadow: 0 1px 0 #7c271e; }
  .btn.green { background: linear-gradient(180deg, #3bc47a, #27ae60); border-color: #1e8449; color: #fff; box-shadow: 0 3px 0 #186a38, 0 4px 8px rgba(0,0,0,.25); text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .btn.green:active { box-shadow: 0 1px 0 #186a38; }
  .btn.cant { opacity: .45; }
  #tabBar { display: none; }
  .tabpane { display: contents; }
  #offerBox:empty { display: none; }
  .pcard, .btnrow, #diceArea { flex-shrink: 0; }
  .pcard {
    background: linear-gradient(180deg, #fffdf6, #f7f1de);
    border: 1px solid #e8dcc0;
    border-radius: 14px;
    padding: 8px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .pcard > strong { display: block; margin-bottom: 6px; font-size: .92rem; }
  @keyframes turnGlow {
    0%, 100% { box-shadow: 0 3px 0 #7c271e, 0 0 0 0 rgba(211,84,80,.55); }
    50% { box-shadow: 0 3px 0 #7c271e, 0 0 0 12px rgba(211,84,80,0); }
  }
  .btn.turn-glow { animation: turnGlow 1.6s ease-in-out infinite; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  #diceArea { display: flex; align-items: center; gap: 12px; }
  #rollBtn { font-size: 1.12rem; padding: 0 10px; width: 48%; height: 57px; margin: 0 auto; display: block; }
  #rollBadge.rolling { animation: shake .3s ease infinite; }
  @keyframes shake {
    0%,100% { transform: rotate(0); } 25% { transform: rotate(-18deg) scale(1.15); }
    50% { transform: rotate(14deg) scale(1.1); } 75% { transform: rotate(-8deg); }
  }
  #resBar { display: flex; gap: 4px; flex-wrap: nowrap; }
  .res {
    background: #fff; border: 2px solid #e0d5b5; border-radius: 10px; padding: 4px 2px;
    font-size: .84rem; font-weight: 800; flex: 1 1 0; min-width: 0; text-align: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.08);
  }
  .res small { display: block; font-weight: 600; font-size: .6rem; color: #8a7a55; }
  .res.bump { animation: resBump .55s ease; }
  @keyframes resBump { 30% { transform: scale(1.16); border-color: var(--gold); background: #fff7d6; } }
  #gainFx { display: none; gap: 5px; flex-wrap: wrap; margin: 0 0 6px; }
  #gainFx.show { display: flex; }
  #gainFx.fade { opacity: 0; transition: opacity .4s ease; }
  .gainChip {
    background: linear-gradient(180deg, #ffffff, #f1e6c8); border: 2px solid var(--gold);
    border-radius: 999px; padding: 3px 10px; font-weight: 800; font-size: .85rem;
    box-shadow: 0 2px 6px rgba(0,0,0,.2); animation: gainPop .35s ease;
  }
  @keyframes gainPop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #devHand { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  #buildBtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #buildBtns .btn { font-size: .74rem; padding: 6px 2px; line-height: 1.3; white-space: nowrap; overflow: hidden; }
  #buildBtns .btn small { font-size: .68rem; white-space: nowrap; }
  #log {
    background: #fffdf6; border: 1px solid #e0d5b5; border-radius: 10px; padding: 8px;
    font-size: .8rem; max-height: 160px; overflow-y: auto;
  }
  #log div { padding: 3px 0; border-bottom: 1px dotted #e8dcc0; }
  .hex { cursor: default; }
  .hex.robber-ok { cursor: pointer; }
  .hex.robber-ok polygon { stroke: var(--gold); stroke-width: 4; }
  .vspot { fill: rgba(255,255,255,.55); stroke: #fff; stroke-width: 2; cursor: pointer; }
  .vspot:hover { fill: var(--gold); }
  .vspot.city { fill: rgba(255,190,40,.5); stroke: var(--gold); stroke-width: 3; }
  .vspot.city.cant { fill: rgba(150,150,150,.35); stroke: #aaa; stroke-dasharray: 4 4; }
  .hitspot { fill: #fff; fill-opacity: 0.01; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%) translateY(16px); background: rgba(20,24,32,.93); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .92rem; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 60; max-width: 88vw; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .profileBar { display:flex; align-items:center; gap:10px; justify-content:center; margin:10px 0 2px; flex-wrap:wrap; }
  .profileBar .pavatar { width:34px; height:34px; border-radius:50%; }
  .profileBar .pnote { font-size:.85rem; opacity:.75; }
  .btn.small { padding:4px 12px; font-size:.85rem; }
  .espot { stroke: rgba(255,255,255,.7); stroke-width: 10; cursor: pointer; fill: none; }
  .espot:hover { stroke: var(--gold); }
  .sspot { stroke: rgba(127,231,255,.85); stroke-width: 10; cursor: pointer; fill: none; stroke-dasharray: 4 8; stroke-linecap: round; }
  .sspot:hover { stroke: var(--gold); }
  .espot.both { stroke: rgba(160,255,190,.8); }
  .road { stroke-width: 7; stroke-linecap: round; fill: none; pointer-events: none; }
  .settlement, .city { pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(2px);
  }
  .card {
    background: linear-gradient(180deg, #fffdf6, var(--panel));
    border-radius: 18px; padding: 24px; max-width: 480px; width: 100%;
    max-height: 88vh; overflow-y: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); border: 1px solid #e8dcc0;
  }
  .card h2 { margin-top: 0; }
  .card input[type=text] {
    width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: 2px solid #d8cba4; font-size: 1rem;
    background: #fff;
  }
  .card .btnrow { margin-top: 12px; }
  .pcolor-pick { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .pcolor-pick .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #555; }
  .tradeRow { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .tradeRow select { padding: 8px; border-radius: 8px; font-size: .9rem; border: 2px solid #d8cba4; background: #fff; }
  .victimBtn { display: block; width: 100%; margin: 6px 0; }
  #winConfetti { font-size: 3rem; text-align: center; }
  .rulesList { font-size: .9rem; line-height: 1.5; }
  .rulesList li { margin-bottom: 6px; }
  .roomCode {
    font-size: 2.6rem; font-weight: 800; letter-spacing: 12px; text-align: center;
    background: #fff; border: 3px dashed var(--gold); border-radius: 14px; padding: 10px;
    margin: 10px 0; font-family: "Baloo 2", sans-serif;
  }
  .lobbyPlayer {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff;
    border-radius: 10px; margin: 6px 0; font-weight: 700; border: 2px solid #e0d5b5;
  }
  .lobbyPlayer .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #555; }
  .offerBanner {
    background: #e8f5e9; border: 2px solid #27ae60; border-radius: 10px; padding: 10px;
    font-size: .88rem; font-weight: 600;
  }
  #boardWrap { position: relative; touch-action: none; overflow: hidden; }
  #rollBadge {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    display: flex; align-items: center; gap: 10px; pointer-events: none;
  }
  #restartBtn {
    position: absolute; top: 10px; right: 10px; z-index: 6;
    width: 46px; height: 46px; border-radius: 50%; padding: 0;
    font-size: 1.25rem; line-height: 1; opacity: .92;
  }
  #timerWrap { display: none; }
  #endTurnWrap { flex: none; width: 48%; margin: 0 auto; border-radius: 14px; min-width: 0; }
  #endTurnWrap.on { padding: 3px; background: conic-gradient(#f6c90e var(--tp,100%), rgba(120,90,20,.28) 0); }
  #endTurnWrap .btn { width: 100%; height: 54px; font-size: 1.02rem; padding: 0 8px; }
  #playerStats { display: flex; flex-direction: column; gap: 6px; }
  .pstat {
    display: flex; align-items: center; gap: 7px;
    background: #fff; border: 1px solid #e8dcc0; border-radius: 10px;
    padding: 6px 8px; font-size: .8rem;
  }
  .pstat .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,.25); }
  .pstat .nm { font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pstat .nums { color: #6b5b3e; white-space: nowrap; }
  .pstat .vp { font-weight: 900; white-space: nowrap; }
  .pstat .badge { white-space: nowrap; }
  #dcDeck {
    position: absolute; left: 10px; bottom: 10px; z-index: 6;
    width: 56px; height: 78px; cursor: pointer;
  }
  #dcDeck .dc-cardback {
    position: absolute; inset: 0; border-radius: 9px;
    background: linear-gradient(135deg, #9b59b6, #6c3483);
    border: 2px solid #f7f1de;
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
  }
  #dcDeck .dc-cardback:nth-child(1) { transform: translate(-5px, 4px) rotate(-7deg); }
  #dcDeck .dc-cardback:nth-child(2) { transform: translate(0, 2px) rotate(2deg); }
  #dcDeck .dc-cardback:nth-child(3) { transform: translate(5px, -3px) rotate(8deg); }
  #dcDeck .dc-cardback span { color: #f6c90e; font-size: 1.6rem; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  #dcDeck:active { transform: scale(.93); }
  #dcDeckCount {
    position: absolute; right: -12px; top: -12px; z-index: 7;
    min-width: 26px; height: 26px; border-radius: 13px; padding: 0 6px;
    background: #f6c90e; color: #5b3a00; font-weight: 900; font-size: .8rem;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.4);
  }
  .dc-fly {
    position: absolute; z-index: 30; width: 56px; height: 78px; border-radius: 9px;
    background: linear-gradient(135deg, #9b59b6, #6c3483);
    border: 2px solid #f7f1de; box-shadow: 0 4px 10px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    color: #f6c90e; font-size: 1.6rem; font-weight: 900;
    pointer-events: none;
    transition: transform .75s ease-in, opacity .75s ease-in;
  }
  #devHand { display: flex; flex-wrap: wrap; gap: 6px; }
  #devHand:not(:empty) { margin-top: 8px; }
  #devHand .res { position: relative; }
  #zoomHint {
    position: absolute; bottom: 8px; right: 10px; z-index: 5;
    font-size: .7rem; color: rgba(255,255,255,.65); pointer-events: none;
  }
  .port { pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="boardWrap"><svg id="board" viewBox="0 0 100 100"></svg>
      <div id="rollBadge" style="display:none"></div>
      <div id="zoomHint">pinch to zoom · double-tap to reset</div>
      <button class="btn" id="restartBtn" title="Restart game">🔄</button>
      <div id="dcDeck" title="Dev card deck — tap to buy">
        <div class="dc-cardback"></div><div class="dc-cardback"></div><div class="dc-cardback"><span>?</span></div>
        <div id="dcDeckCount">25</div>
      </div>
    </div>
    <div id="panel">
      <div id="offerBox"></div>
      <div id="tabBar">
        <button class="tabbtn active" data-tab="play">🎲 Play</button>
        <button class="tabbtn" data-tab="build">🔨 Build</button>
        <button class="tabbtn" data-tab="trade">🔄 Trade</button>
      </div>
      <div class="tabpane active" id="pane-play">
        <div id="diceArea">
          <button class="btn primary" id="rollBtn" disabled>🎲 Roll Dice</button>
        </div>
        <div class="pcard"><strong id="resTitle">Resources</strong><div id="gainFx"></div><div id="resBar"></div></div>
        <div class="btnrow"><div id="endTurnWrap"><button class="btn green" id="endTurnBtn" disabled>✅ End Turn</button></div></div>
        <div class="pcard"><strong>Players</strong><div id="playerStats"></div></div>
        <div id="logWrap" style="display:none"><div id="log"></div></div>
      </div>
      <div class="tabpane" id="pane-build">
        <div class="pcard"><strong>Build</strong><div id="buildBtns">
          <button class="btn" id="buildRoad">🛣️ Road<br><small>1🧱 1🪵</small></button>
          <button class="btn" id="buildShip" style="display:none">⛵ Ship<br><small>1🪵 1🐑</small></button>
          <button class="btn" id="moveShipBtn" style="display:none">↔️ Move Ship<br><small>free · 1/turn</small></button>
          <button class="btn" id="buildSettle">🏠 Settlement<br><small>1🧱 1🪵 1🐑 1🌾</small></button>
          <button class="btn" id="buildCity">🏘️ City<br><small>2🌾 3⛰️</small></button>
          <button class="btn" id="buyDevBtn">🧙 Dev Card<br><small>1🌾 1🐑 1⛰️</small></button>
        </div><div id="devHand"></div></div>
      </div>
      <div class="tabpane" id="pane-trade">
        <div class="pcard"><strong>Trade</strong>
          <div class="btnrow">
            <button class="btn" id="bankTradeBtn">🏦 Trade with Bank</button>
            <button class="btn" id="offerTradeBtn">🤝 Trade with Players</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="overlayRoot"></div>
<div id="toast"></div>
<script src="game.js"></script>
</body>
</html>
