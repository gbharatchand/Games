<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b2340" />
<title>Color Echo — Bharat's Game World</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&display=swap");
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:"Fredoka",system-ui,sans-serif;color:#fff;overflow-x:hidden;min-height:100vh;
  background:radial-gradient(circle at 50% 20%,#2b3a6e,#141b3d 70%);
  display:flex;flex-direction:column;align-items:center;padding:18px 14px 40px;
}
.topbar{width:min(560px,100%);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.homeBtn{
  text-decoration:none;font-weight:800;color:#17406b;background:rgba(255,255,255,.92);
  padding:10px 16px;border-radius:999px;box-shadow:0 6px 14px rgba(0,0,0,.25);font-size:1.05rem;
}
.homeBtn:active{transform:translateY(2px)}
h1{font-family:"Baloo 2",sans-serif;font-size:clamp(1.8rem,6vw,2.6rem);color:#fff;text-align:center;
  text-shadow:0 3px 0 rgba(0,0,0,.25)}
.subtitle{text-align:center;font-weight:700;color:#bcd2ff;margin:2px 0 12px}
.stats{width:min(560px,100%);display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);border-radius:18px;
  padding:8px 18px;font-weight:800;font-size:1.05rem}
.stat b{color:#ffd84d}
#message{min-height:2.2em;font-size:1.3rem;font-weight:800;color:#ffd84d;text-align:center;margin-bottom:10px}
#pads{width:min(560px,94vw);display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pad{
  aspect-ratio:1;border:none;cursor:pointer;border-radius:32px;
  border:6px solid rgba(255,255,255,.35);
  box-shadow:0 10px 0 rgba(0,0,0,.30),0 18px 26px rgba(0,0,0,.35), inset 0 -8px 0 rgba(0,0,0,.18);
  opacity:.85;transition:transform .08s, opacity .12s, box-shadow .12s, filter .12s;
  font-size:3rem;color:rgba(255,255,255,.85);
}
.pad:active{transform:translateY(6px)}
.pad[data-color="red"]{background:linear-gradient(180deg,#ff6b6b,#d63d3d)}
.pad[data-color="blue"]{background:linear-gradient(180deg,#5aa9ff,#2b6fe3)}
.pad[data-color="green"]{background:linear-gradient(180deg,#7de87d,#35b535)}
.pad[data-color="yellow"]{background:linear-gradient(180deg,#ffe066,#f0b429)}
.pad.lit{opacity:1;filter:brightness(1.5) saturate(1.2);
  box-shadow:0 10px 0 rgba(0,0,0,.30),0 0 45px 12px rgba(255,255,255,.55)}
.pad.wrong{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.controls{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bigBtn{border:none;cursor:pointer;font-family:"Baloo 2",sans-serif;font-size:1.3rem;font-weight:800;color:#fff;
  padding:14px 34px;border-radius:999px;background:linear-gradient(180deg,#8fea55,#3caf32);
  box-shadow:0 6px 0 #267929}
.bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #267929}
.stars{font-size:1.6rem;letter-spacing:4px;min-height:2rem;text-align:center;margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(10,14,35,.72);display:none;place-items:center;z-index:50;padding:20px}
.overlay.show{display:grid}
.panel{background:#fff;border-radius:32px;padding:34px 30px;text-align:center;max-width:420px;width:100%;color:#173b5f;
  border:6px solid #8f7cff;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.panel h2{font-family:"Baloo 2",sans-serif;font-size:2rem;color:#5b4bd6;margin-bottom:8px}
.panel p{font-weight:700;color:#31526a;margin-bottom:18px}
</style>
</head>
<body>
<div class="topbar">
  <a class="homeBtn" href="../">🏠 Home</a>
  <div class="stat">Level <b id="level">–</b></div>
</div>
<h1>🌈 Color Echo</h1>
<div class="subtitle">Watch, listen, and repeat the pattern!</div>
<div class="stars" id="stars"></div>
<div id="message">Tap Start to play!</div>
<div id="pads">
  <button class="pad" data-color="red" aria-label="red">🔴</button>
  <button class="pad" data-color="blue" aria-label="blue">🔵</button>
  <button class="pad" data-color="green" aria-label="green">🟢</button>
  <button class="pad" data-color="yellow" aria-label="yellow">🟡</button>
</div>
<div class="controls">
  <button class="bigBtn" id="startBtn">▶ Start</button>
</div>

<div class="overlay" id="startOverlay">
  <div class="panel">
    <h2>🌈 Color Echo</h2>
    <p>Watch the colors light up and play their sounds.<br>Then tap them in the <b>same order</b>!<br><br>Each round the pattern gets one step longer. How far can you go?</p>
    <button class="bigBtn" id="goBtn">Let's Play! ▶</button>
  </div>
</div>

<script>
const TONES = { red: 261.63, blue: 329.63, green: 392.00, yellow: 523.25 };
const COLORS = ["red","blue","green","yellow"];
let sequence = [], playerIdx = 0, acceptingInput = false, audioCtx = null;
let best = 0;

const pads = {};
document.querySelectorAll(".pad").forEach(p=>{
  pads[p.dataset.color] = p;
  p.addEventListener("click", ()=>onPad(p.dataset.color));
});

function tone(freq, dur=0.35){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }catch(e){}
}
function light(color, dur=420){
  return new Promise(res=>{
    const p = pads[color];
    p.classList.add("lit"); tone(TONES[color]);
    setTimeout(()=>{ p.classList.remove("lit"); setTimeout(res, 120); }, dur);
  });
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
function setMsg(t){ document.getElementById("message").textContent = t; }

async function playSequence(){
  acceptingInput = false;
  setMsg("👀 Watch carefully...");
  await wait(700);
  for(const c of sequence){ await light(c); }
  playerIdx = 0;
  acceptingInput = true;
  setMsg("👆 Your turn! Repeat it!");
}

function onPad(color){
  if(!acceptingInput) return;
  light(color, 250);
  if(color === sequence[playerIdx]){
    playerIdx++;
    if(playerIdx === sequence.length){
      acceptingInput = false;
      best = Math.max(best, sequence.length);
      updateStars();
      setMsg("🎉 Great! One more step...");
      setTimeout(()=>{
        sequence.push(COLORS[Math.floor(Math.random()*4)]);
        document.getElementById("level").textContent = sequence.length;
        playSequence();
      }, 1200);
    }
  } else {
    acceptingInput = false;
    pads[color].classList.add("wrong");
    setTimeout(()=>pads[color].classList.remove("wrong"), 450);
    tone(180, 0.4);
    setMsg("💛 Oops! Watch again...");
    setTimeout(playSequence, 1600);
  }
}

function updateStars(){
  const s = document.getElementById("stars");
  let txt = "";
  if(best >= 3) txt += "⭐";
  if(best >= 5) txt += "⭐";
  if(best >= 8) txt += "⭐";
  s.textContent = txt;
}

function startGame(){
  sequence = [COLORS[Math.floor(Math.random()*4)]];
  document.getElementById("level").textContent = "1";
  document.getElementById("startOverlay").classList.remove("show");
  playSequence();
}

document.getElementById("startBtn").onclick = startGame;
document.getElementById("goBtn").onclick = startGame;
document.getElementById("startOverlay").classList.add("show");
</script>
</body>
</html>
