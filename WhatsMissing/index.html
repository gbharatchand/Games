<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#8edcff" />
<title>What's Missing? — Bharat's Game World</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&display=swap");
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:"Fredoka",system-ui,sans-serif;color:#173b5f;overflow-x:hidden;min-height:100vh;
  background:linear-gradient(180deg,#bdf1ff 0%,#e9fbff 45%,#ffe9f3 70%,#ffc7e3 100%);
  display:flex;flex-direction:column;align-items:center;padding:18px 14px 40px;
}
.topbar{width:min(680px,100%);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.homeBtn{
  text-decoration:none;font-weight:800;color:#17406b;background:rgba(255,255,255,.85);
  padding:10px 16px;border-radius:999px;box-shadow:0 6px 14px rgba(40,100,140,.15);font-size:1.05rem;
}
.homeBtn:active{transform:translateY(2px)}
h1{font-family:"Baloo 2",sans-serif;font-size:clamp(1.8rem,6vw,2.6rem);color:#456b92;text-align:center;
  text-shadow:0 3px 0 rgba(255,255,255,.9)}
.subtitle{text-align:center;font-weight:700;color:#31526a;margin:2px 0 12px}
.stats{width:min(680px,100%);display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.88);border-radius:18px;padding:8px 18px;font-weight:800;color:#17406b;
  box-shadow:0 6px 14px rgba(40,100,140,.12);font-size:1.05rem}
.stat b{color:#ff7b54}
#prompt{font-size:1.35rem;font-weight:800;color:#5b4bd6;text-align:center;min-height:2.4em;margin-bottom:8px}
#stage{width:min(680px,100%);min-height:220px;display:flex;align-items:center;justify-content:center;
  gap:14px;flex-wrap:wrap;background:rgba(255,255,255,.55);border-radius:32px;padding:24px 16px;
  border:5px solid rgba(255,255,255,.8);box-shadow:0 12px 26px rgba(40,100,140,.12);margin-bottom:14px;
  position:relative;overflow:hidden}
.item{font-size:clamp(2.6rem,10vw,4rem);background:#fff;border-radius:24px;padding:14px;
  border:4px solid #ffe066;box-shadow:0 6px 0 rgba(0,0,0,.08);animation:popIn .4s ease}
@keyframes popIn{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#curtain{position:absolute;inset:0;display:none;place-items:center;background:
  repeating-linear-gradient(90deg,#ff5ca8 0 34px,#ff7bba 34px 68px);
  font-size:4rem;z-index:5;transition:transform .6s ease}
#curtain.show{display:grid}
#curtain.lift{transform:translateY(-110%)}
#choices{width:min(680px,100%);display:flex;gap:14px;justify-content:center;flex-wrap:wrap;min-height:110px}
.choice{font-size:clamp(2.4rem,9vw,3.4rem);background:#fff;border:5px solid #8f7cff;border-radius:24px;
  padding:12px 18px;cursor:pointer;box-shadow:0 8px 0 rgba(91,75,214,.25);transition:transform .12s}
.choice:active{transform:scale(.92)}
.choice.wrong{animation:shake .4s;border-color:#ff5c5c}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.choice.right{border-color:#3caf32;background:#e6ffe6;animation:popIn .4s}
#stars{font-size:1.8rem;letter-spacing:6px;min-height:2.4rem;text-align:center}
.timer{width:min(680px,100%);height:14px;background:rgba(255,255,255,.6);border-radius:999px;overflow:hidden;margin-bottom:10px}
#timerFill{height:100%;width:100%;background:linear-gradient(90deg,#8fea55,#3caf32);border-radius:999px;transition:width 1s linear}
.overlay{position:fixed;inset:0;background:rgba(23,59,95,.55);display:none;place-items:center;z-index:50;padding:20px}
.overlay.show{display:grid}
.panel{background:#fff;border-radius:32px;padding:34px 30px;text-align:center;max-width:420px;width:100%;
  border:6px solid #ff5ca8;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.panel h2{font-family:"Baloo 2",sans-serif;font-size:2rem;color:#ff5ca8;margin-bottom:8px}
.panel p{font-weight:700;color:#31526a;margin-bottom:18px}
.bigBtn{border:none;cursor:pointer;font-family:"Baloo 2",sans-serif;font-size:1.25rem;font-weight:800;color:#fff;
  padding:14px 30px;border-radius:999px;background:linear-gradient(180deg,#8fea55,#3caf32);
  box-shadow:0 6px 0 #267929}
.bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #267929}
.confetti{position:fixed;top:-40px;font-size:1.6rem;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar">
  <a class="homeBtn" href="../">🏠 Home</a>
  <div class="stat">Round <b id="round">1</b> / 6</div>
</div>
<h1>🔍 What's Missing?</h1>
<div class="subtitle">Remember the friends, then spot who hid!</div>
<div id="stars"></div>
<div class="stats"><div class="stat">⭐ Stars: <b id="starCount">0</b></div></div>
<div id="prompt"></div>
<div class="timer"><div id="timerFill"></div></div>
<div id="stage"><div id="curtain">🎩</div></div>
<div id="choices"></div>

<div class="overlay" id="winOverlay">
  <div class="panel">
    <h2>🌟 Memory Star! 🌟</h2>
    <p id="winText"></p>
    <button class="bigBtn" id="againBtn">🔁 Play Again</button>
  </div>
</div>

<script>
const POOL = ["🦁","🐼","🐸","🐵","🐘","🐧","🐯","🐨","🦄","🐝","🦋","🐢","🐙","🦀","🐳","🦜"];
const TOTAL_ROUNDS = 6;
let round = 1, stars = 0, audioCtx = null, missing = null, timerInt = null;

function tone(freq, dur=0.18, type="sine", vol=0.22, when=0){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }catch(e){}
}
const sndGood = ()=>{tone(660,0.12,"sine",0.22);tone(990,0.2,"sine",0.22,0.1);};
const sndBad = ()=>tone(220,0.25,"triangle",0.15);
const sndWin = ()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.22,"sine",0.22,i*0.13));};

function setPrompt(t){ document.getElementById("prompt").textContent = t; }
function updateStars(){
  document.getElementById("starCount").textContent = stars;
  document.getElementById("stars").textContent = "⭐".repeat(stars);
}
function confetti(){
  const emojis = ["🎉","⭐","🎈","🌟","💫","🥳"];
  for(let i=0;i<50;i++){
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + "vw";
    s.style.animationDuration = (2+Math.random()*2.5) + "s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 5000);
  }
}

function newRound(){
  clearInterval(timerInt);
  document.getElementById("round").textContent = round;
  const stage = document.getElementById("stage");
  const curtain = document.getElementById("curtain");
  const choices = document.getElementById("choices");
  choices.innerHTML = "";
  curtain.classList.remove("show","lift");

  const itemCount = round <= 2 ? 3 : round <= 4 ? 4 : 5;
  const memorizeSec = round <= 2 ? 4 : 3;
  const items = [...POOL].sort(()=>Math.random()-0.5).slice(0, itemCount);
  missing = items[Math.floor(Math.random()*items.length)];

  setPrompt("👀 Remember these friends!");
  stage.querySelectorAll(".item").forEach(e=>e.remove());
  items.forEach(e=>{
    const d = document.createElement("div");
    d.className = "item"; d.textContent = e;
    stage.appendChild(d);
  });

  // countdown bar
  const fill = document.getElementById("timerFill");
  fill.style.transition = "none"; fill.style.width = "100%";
  requestAnimationFrame(()=>{ fill.style.transition = `width ${memorizeSec}s linear`; fill.style.width = "0%"; });

  setTimeout(()=>{
    setPrompt("🎩 Abracadabra... one friend hid!");
    curtain.classList.add("show");
    tone(400,0.3,"sine",0.18); tone(600,0.3,"sine",0.18,0.2);
    setTimeout(()=>{
      stage.querySelectorAll(".item").forEach(el=>{
        if(el.textContent === missing) el.remove();
      });
      curtain.classList.add("lift");
      setTimeout(()=>curtain.classList.remove("show","lift"), 700);
      askQuestion(items);
    }, 1400);
  }, memorizeSec * 1000);
}

function askQuestion(items){
  setPrompt("🤔 Who is missing? Tap them!");
  const choices = document.getElementById("choices");
  choices.innerHTML = "";
  const distract = [...POOL].filter(e=>!items.includes(e))
    .sort(()=>Math.random()-0.5).slice(0, 3);
  const options = [...distract, missing].sort(()=>Math.random()-0.5);
  options.forEach(e=>{
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = e;
    b.onclick = ()=>{
      if(e === missing){
        b.classList.add("right"); sndGood(); confetti();
        stars++; updateStars();
        setPrompt("🎉 Great memory! " + missing + " was hiding!");
        setTimeout(()=>{
          if(round >= TOTAL_ROUNDS){ finish(); }
          else { round++; newRound(); }
        }, 1500);
      } else {
        b.classList.add("wrong"); sndBad();
        setPrompt("💛 Try again! Look carefully...");
        setTimeout(()=>b.classList.remove("wrong"), 450);
      }
    };
    choices.appendChild(b);
  });
}

function finish(){
  sndWin(); confetti();
  document.getElementById("winText").textContent =
    `You earned ${stars} stars! Your memory is super strong! 💪`;
  document.getElementById("winOverlay").classList.add("show");
}
document.getElementById("againBtn").onclick = ()=>{
  document.getElementById("winOverlay").classList.remove("show");
  round = 1; stars = 0; updateStars(); newRound();
};

updateStars();
newRound();
</script>
</body>
</html>
